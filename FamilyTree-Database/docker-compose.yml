services:
  postgres:
    image: postgres:16
    container_name: familytree-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familytree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familytree}
      POSTGRES_DB: ${POSTGRES_DB:-familytree}
    ports:
      - "5432:5432"
    volumes:
      - familytree-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familytree}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  familytree-postgres-data:
